name: Scheduled discovery

# Vercel's Hobby plan allows two cron jobs, once a day each. Running the
# schedule from GitHub Actions instead keeps discovery at three times a day
# on the free tier — the endpoints authenticate with CRON_SECRET either way,
# so this and vercel.json are interchangeable.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      https://your-app.vercel.app
#   CRON_SECRET  the same value as the deployment's CRON_SECRET

on:
  schedule:
    # 08:00, 13:00 and 18:00 US Eastern (13/18/23 UTC).
    - cron: "0 13,18,23 * * *"
  workflow_dispatch:
    inputs:
      maxScored:
        description: "Max jobs to score this run"
        required: false
        default: "40"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger discovery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_SCORED: ${{ github.event.inputs.maxScored || '40' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set."
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS -o "$response" -w "%{http_code}" \
            --max-time 540 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/discover?maxScored=$MAX_SCORED")

          echo "HTTP $status"
          cat "$response"
          echo

          if [ "$status" != "200" ]; then
            echo "::error::Discovery failed with HTTP $status"
            exit 1
          fi
